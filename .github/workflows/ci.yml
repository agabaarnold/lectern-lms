name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Dummy values satisfy env validation at build time; nothing here
    # touches a real database or external service.
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://user:password@localhost:5432/db
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-dummy-secret-at-least-32-chars-long
      GOOGLE_CLIENT_ID: ci-dummy
      GOOGLE_CLIENT_SECRET: ci-dummy
      GITHUB_CLIENT_ID: ci-dummy
      GITHUB_CLIENT_SECRET: ci-dummy
      AWS_ACCESS_KEY_ID: ci-dummy
      AWS_SECRET_ACCESS_KEY: ci-dummy
      AWS_ENDPOINT_URL_S3: http://localhost:9000
      AWS_ENDPOINT_URL_IAM: http://localhost:9000
      AWS_REGION: us-east-1
      VITE_S3_BUCKET_NAME_IMAGES: ci-dummy-bucket
      STRIPE_SECRET_KEY: sk_test_ci-dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci-dummy
      ARCJET_KEY: ajkey_ci-dummy
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Full-repo lint has pre-existing violations in untouched vendor-style
      # components, so the gate lints only files changed in the PR. tsc and
      # the build below still run against the whole tree.
      - name: Lint changed files
        run: |
          files=$(git diff --name-only origin/main...HEAD --diff-filter=ACMRT -- '*.ts' '*.tsx')
          if [ -n "$files" ]; then
            echo "$files" | xargs -r -d '\n' pnpm dlx ultracite check
          else
            echo "No changed TS files to lint."
          fi
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
